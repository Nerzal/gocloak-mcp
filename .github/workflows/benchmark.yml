name: Head-to-Head Benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: Compare Keycloak MCP Servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build gocloak-mcp
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/bench/gocloak-mcp ./cmd/gocloak-mcp

      - name: Fetch sshaaf/keycloak-mcp-server v0.4.0 (Native + JVM)
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench/sshaaf
          curl -fsSL -o /tmp/bench/sshaaf/keycloak-mcp-server-linux \
            https://github.com/sshaaf/keycloak-mcp-server/releases/download/v0.4.0/keycloak-mcp-server-0.4.0-linux
          chmod +x /tmp/bench/sshaaf/keycloak-mcp-server-linux
          curl -fsSL -o /tmp/bench/sshaaf/keycloak-mcp-server-runner.jar \
            https://github.com/sshaaf/keycloak-mcp-server/releases/download/v0.4.0/keycloak-mcp-server-0.4.0-runner.jar

      - name: Fetch & build HaithamOumerzoug/keycloak-mcp 1.2.5 (TypeScript/Node)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.2.5 https://github.com/HaithamOumerzoug/keycloak-mcp.git /tmp/bench/haitham
          npm --prefix /tmp/bench/haitham ci
          npm --prefix /tmp/bench/haitham run build

      - name: Fetch & install idoyudha/mcp-keycloak v1.2.2 (Python/FastMCP)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.2.2 https://github.com/idoyudha/mcp-keycloak.git /tmp/bench/idoyudha
          python3 -m venv /tmp/bench/idoyudha/.venv
          /tmp/bench/idoyudha/.venv/bin/pip install --quiet "mcp<2" /tmp/bench/idoyudha

      - name: Measure OCI container image sizes
        run: |
          set -euo pipefail
          docker build -q -t gocloak-mcp:bench .
          docker pull -q quay.io/sshaaf/keycloak-mcp-server:latest || true
          {
            echo "### Container Image Sizes"
            echo "| Image | Size |"
            echo "| --- | ---: |"
            docker images --format "| {{.Repository}}:{{.Tag}} | {{.Size}} |" \
              | grep -E "gocloak-mcp:bench|sshaaf/keycloak-mcp-server" || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run head-to-head benchmarks
        run: |
          set -euo pipefail
          python3 benchmarks/run_benchmarks.py \
            --gocloak-bin /tmp/bench/gocloak-mcp \
            --haitham-entry /tmp/bench/haitham/dist/server.js \
            --idoyudha-bin /tmp/bench/idoyudha/.venv/bin/mcp-keycloak \
            --sshaaf-native /tmp/bench/sshaaf/keycloak-mcp-server-linux \
            --sshaaf-jar /tmp/bench/sshaaf/keycloak-mcp-server-runner.jar \
            --out /tmp/bench/benchmark-results.json | tee -a "$GITHUB_STEP_SUMMARY"
          cat /tmp/bench/benchmark-results.json
